<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SQRNLMSNS8"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-SQRNLMSNS8');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteakAgent - Find the Best Steakhouses</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1 id="mainTitle">SteakAgent.com</h1>
    <div id="logos">
        <span>🥩🍽️</span>
        <span>🍽️🥩</span>
    </div>
    <h2 id="mainSubTitle">Find the Best Steakhouses</h2>

    <div id="flags">
        <button onclick="setLanguage('en')">🇬🇧</button>
        <button onclick="setLanguage('fr')">🇫🇷</button>
        <button onclick="setLanguage('es')">🇪🇸</button>
        <button onclick="setLanguage('it')">🇮🇹</button>
        <button onclick="setLanguage('de')">🇩🇪</button>
        <button onclick="setLanguage('zh')">🇨🇳</button>
    </div>
    <div id="inputContainer">
        <input type="text" id="locationInput" placeholder="Enter your city or town">
    </div>
    <div>
        <button id="buttonFind" onclick="searchSteakhouses()">Find Steakhouses</button>
    </div>
    <div><p></p></div>
    <div class="error-message" id="errorMessage"></div>
    <div id="results"></div>

    <script>
         const translations = {
            en: { mainSubTitle: "Find the Best Steakhouses", enterLocation: "Enter your location", findSteakhouses: "Find Steakhouses", noResults: "No steakhouses found within {0} km.", searchWithin: "Search within {0} km", bookNow: "Book Now", showOnMap: "Show on Map" },
            fr: { mainSubTitle: "Trouver les meilleurs steakhouses", enterLocation: "Entrez votre emplacement", findSteakhouses: "Trouver des steakhouses", noResults: "Aucun steakhouse trouvé dans un rayon de {0} km.", searchWithin: "Rechercher dans un rayon de {0} km", bookNow: "Réserver maintenant", showOnMap: "Afficher sur la carte" },
            es: { mainSubTitle: "Encuentra los mejores steakhouses", enterLocation: "Ingrese su ubicación", findSteakhouses: "Encontrar steakhouses", noResults: "No se encontraron steakhouses dentro de {0} km.", searchWithin: "Buscar dentro de {0} km", bookNow: "Reservar ahora", showOnMap: "Mostrar en el mapa" },
            it: { mainSubTitle: "Trova i migliori steakhouses", enterLocation: "Inserisci la tua posizione", findSteakhouses: "Trova steakhouses", noResults: "Nessun steakhouse trovato entro {0} km.", searchWithin: "Cerca entro {0} km", bookNow: "Prenota ora", showOnMap: "Mostra sulla mappa" },
            de: { mainSubTitle: "Finde die besten Steakhouses", enterLocation: "Geben Sie Ihren Standort ein", findSteakhouses: "Finde Steakhouses", noResults: "Keine Steakhouses innerhalb von {0} km gefunden.", searchWithin: "Suche innerhalb von {0} km", bookNow: "Jetzt buchen", showOnMap: "Auf der Karte anzeigen" },
            zh: { mainSubTitle: "寻找最佳牛排馆", enterLocation: "输入您的位置", findSteakhouses: "寻找牛排馆", noResults: "在{0}公里范围内未找到牛排馆。", searchWithin: "在{0}公里范围内搜索", bookNow: "立即预订", showOnMap: "在地图上显示" }
        };

        let currentLanguage = 'en';

        function setLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('mainSubTitle').textContent = translations[currentLanguage].mainSubTitle;
            document.getElementById('locationInput').placeholder = translations[currentLanguage].enterLocation;
            document.getElementById('buttonFind').textContent = translations[currentLanguage].findSteakhouses;
        }

        async function searchSteakhouses(radius = 1000) {
            const locationInput = document.getElementById('locationInput');
            const location = locationInput.value.trim();
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.textContent = ''; // Clear previous error

            if (!location) {
                errorMessage.textContent = translations[currentLanguage].enterLocation;
                return;
            }

            const response = await fetch('https://steakagent.onrender.com/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ location, radius })
            });

            const data = await response.json();
            displayResults(data.restaurants, location, radius);
        }

        function displayResults(restaurants, location, radius) {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';

            if (restaurants.length === 0) {
                const nextRadius = getNextRadius(radius);
                if (nextRadius) {
                    const message = document.createElement('div');
                    message.className = 'radius-message';
                    message.innerHTML = `
                        <p>${translations[currentLanguage].noResults.replace('{0}', (radius / 1000).toFixed(1))}</p>
                        <button onclick="searchSteakhouses(${nextRadius})">${translations[currentLanguage].searchWithin.replace('{0}', (nextRadius / 1000).toFixed(1))}</button>
                    `;
                    resultsContainer.appendChild(message);
                } else {
                    resultsContainer.innerHTML = `<p>${translations[currentLanguage].noResults.replace('{0}', 50)}</p>`;
                }
                return;
            }

            restaurants.forEach(restaurant => {
                const card = document.createElement('div');
                card.className = 'restaurant-card';

                card.innerHTML = `
                    <div class="restaurant-name">${restaurant.name}</div>
                    <div class="restaurant-address">${restaurant.address}</div>
                    <div class="restaurant-reviews">
                        <div class="rating">⭐ ${restaurant.rating}</div>
                        <div class="review-count"> based on ${restaurant.reviews} reviews.</div>
                    </div>
                    <div class="cta-buttons">
                        <a href="${restaurant.website}" target="_blank">${translations[currentLanguage].bookNow}</a>
                        <a href="${restaurant.maps_link}" target="_blank">${translations[currentLanguage].showOnMap}</a>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        function getNextRadius(currentRadius) {
            const radiusSequence = [1000, 5000, 10000, 50000];
            const currentIndex = radiusSequence.indexOf(currentRadius);
            return currentIndex !== -1 && currentIndex < radiusSequence.length - 1 ? radiusSequence[currentIndex + 1] : null;
        }
    </script>
</body>
</html>
